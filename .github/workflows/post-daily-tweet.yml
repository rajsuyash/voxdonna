name: post daily tweet

on:
  schedule:
    # 09:30 UTC daily (10:30 Paris CEST / 5:30am ET)
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set to 1 for dry-run (don't post, just print)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests==2.32.3 requests-oauthlib==2.0.0

      - name: Post next tweet
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/post-next-tweet.py

      - name: Commit queue updates
        if: ${{ inputs.dry_run != '1' }}
        run: |
          if git diff --quiet tweets/; then
            echo "no queue changes"
            exit 0
          fi
          git config user.name "voxdonna-bot"
          git config user.email "bot@voxdonna.com"
          git add tweets/
          git commit -m "chore(tweets): post next queued tweet"
          git push
