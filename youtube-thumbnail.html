<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voxdonna AI — YouTube Thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1280px;
    height: 720px;
    background: #0a0a0c;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #f5f5f7;
    overflow: hidden;
  }

  .frame {
    position: relative;
    width: 1280px;
    height: 720px;
    padding: 64px 80px;
    overflow: hidden;
    background:
      radial-gradient(circle at 75% 50%, rgba(193,127,89,0.18) 0%, transparent 55%),
      radial-gradient(circle at 10% 80%, rgba(193,127,89,0.06) 0%, transparent 50%),
      #0a0a0c;
  }

  /* Tiny brand mark top-left */
  .brand {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.32em;
    color: #d4a574;
    text-transform: uppercase;
  }

  /* LEFT — text stack */
  .left {
    position: absolute;
    top: 50%;
    left: 80px;
    transform: translateY(-50%);
    max-width: 640px;
    z-index: 2;
  }
  .title {
    font-size: 148px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: #ffffff;
    margin-bottom: 28px;
  }
  .subtitle {
    font-size: 36px;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: #d4a574;
    margin-bottom: 20px;
  }
  .domain {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: rgba(245,245,247,0.55);
  }

  /* RIGHT — copper orb (concentric rings) */
  .orb-wrap {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    width: 460px;
    height: 460px;
    z-index: 1;
  }
  .ring {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .ring-1 {
    width: 460px; height: 460px;
    background: radial-gradient(circle, rgba(193,127,89,0.05) 0%, transparent 70%);
    border: 1px solid rgba(193,127,89,0.18);
  }
  .ring-2 {
    width: 360px; height: 360px;
    border: 1.5px solid rgba(193,127,89,0.32);
  }
  .ring-3 {
    width: 270px; height: 270px;
    border: 2px solid rgba(193,127,89,0.5);
  }
  .ring-4 {
    width: 190px; height: 190px;
    background: radial-gradient(circle, rgba(193,127,89,0.4) 0%, rgba(193,127,89,0.15) 50%, transparent 100%);
    border: 2px solid rgba(212,165,116,0.7);
    box-shadow: 0 0 60px rgba(193,127,89,0.4);
  }
  .ring-5 {
    width: 120px; height: 120px;
    background: radial-gradient(circle, #d4a574 0%, #c17f59 50%, #8a5a3e 100%);
    box-shadow:
      0 0 40px rgba(212,165,116,0.6),
      0 0 80px rgba(193,127,89,0.3);
  }
  .core {
    width: 60px; height: 60px;
    background: radial-gradient(circle, #f5e6d3 0%, #d4a574 100%);
    box-shadow: 0 0 30px rgba(245,230,211,0.8);
  }

  /* Bottom-left badge — moved off the orb */
  .badge {
    position: absolute;
    bottom: 80px;
    left: 80px;
    padding: 12px 22px;
    border: 2px solid rgba(193,127,89,0.55);
    border-radius: 999px;
    background: rgba(193,127,89,0.14);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #d4a574;
    text-transform: uppercase;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    line-height: 1;
  }
  .badge-dot {
    width: 10px;
    height: 10px;
    background: #5cb85c;
    border-radius: 50%;
    box-shadow: 0 0 10px #5cb85c;
  }

  /* Top brand position */
  .brand-pos {
    position: absolute;
    top: 64px;
    left: 80px;
    z-index: 3;
  }

  /* Optional: subtle grid texture in the background */
  .frame::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="brand brand-pos">Voxdonna AI</div>

  <div class="left">
    <div class="title">Meet<br>Donna</div>
    <div class="subtitle">Voice AI that sounds human</div>
    <div class="domain">voxdonna.com</div>
  </div>

  <div class="orb-wrap">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="ring ring-4"></div>
    <div class="ring ring-5"></div>
    <div class="ring core"></div>
  </div>

  <div class="badge"><span class="badge-dot"></span>12 Live Demos · Free</div>
</div>
</body>
</html>
