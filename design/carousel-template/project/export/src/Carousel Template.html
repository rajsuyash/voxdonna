<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxdonna · Carousel Template</title>

  <!-- Bundler resource declarations (PNGs referenced from JSX as strings) -->
  <meta name="ext-resource-dependency" content="assets/voxdonna-mark.png" data-resource-id="voxdonnaMark" />
  <meta name="ext-resource-dependency" content="assets/voxdonna-logo.png" data-resource-id="voxdonnaLogo" />

  <!-- Splash thumbnail shown by the bundler while unpacking / when JS is disabled -->
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <rect width="100" height="100" fill="#000"/>
      <g transform="translate(50 50)">
        <polygon points="0,-18 22,-2 0,14 -22,-2" fill="#c17f59"/>
        <polygon points="0,4 22,16 0,32 -22,16" fill="#6b3f28"/>
        <polygon points="0,22 22,34 0,50 -22,34" fill="#c17f59" opacity="0.85"/>
      </g>
      <text x="50" y="78" text-anchor="middle" fill="#f5f5f7"
            font-family="-apple-system, BlinkMacSystemFont, sans-serif"
            font-size="9" font-weight="700" letter-spacing="-0.02em">Vox<tspan fill="#c17f59">donna</tspan></text>
      <text x="50" y="88" text-anchor="middle" fill="rgba(245,245,247,0.5)"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="4" letter-spacing="0.2em">CAROUSEL · 1080×1080</text>
    </svg>
  </template>

  <link rel="stylesheet" href="assets/voxdonna-tokens.css" />

  <style>
    html, body { margin: 0; padding: 0; background: #000; min-height: 100vh;
                  font-family: var(--font-sans); color: var(--fg-1); }
    #root { min-height: 100vh; }

    /* ──────────────────────────────────────────────────────────────
       FILTER MODE — ?only=editorial | operator | marquee
       Stacks slides vertically at full 1080×1080. Prints to PDF
       one slide per page (1080×1080). Screenshot any .export-slide
       to get an Instagram-ready JPG.
       ────────────────────────────────────────────────────────────── */
    .export-stack {
      width: 1080px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 32px;
      padding: 32px 0;
    }
    .export-slide {
      width: 1080px; height: 1080px;
      box-shadow: 0 0 0 1px var(--border-2);
      position: relative;
    }
    .export-slide::after {
      content: attr(data-screen-label);
      position: absolute; top: -28px; left: 0;
      font-family: var(--font-mono); font-size: 13px;
      color: var(--fg-3); letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @media print {
      @page { size: 1080px 1080px; margin: 0; }
      html, body { background: #000 !important; }
      .export-stack { gap: 0; padding: 0; width: 1080px; margin: 0; }
      .export-slide {
        page-break-after: always; break-after: page;
        box-shadow: none; margin: 0;
      }
      .export-slide::after { display: none; }
      .export-slide:last-child { page-break-after: auto; }
    }
  </style>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Content (plain JS — edit this for new carousels) -->
  <script src="slide-data.js"></script>

  <!-- Direction renderers -->
  <script type="text/babel" data-presets="react" src="direction-editorial.jsx"></script>
  <script type="text/babel" data-presets="react" src="direction-operator.jsx"></script>
  <script type="text/babel" data-presets="react" src="direction-marquee.jsx"></script>

  <!-- Canvas / filter app -->
  <script type="text/babel" data-presets="react" src="design-canvas.jsx"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
