<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Roster — Claude Enterprise Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=8a3e698">
<style>
  table.roster { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 780px; }
  table.roster th, table.roster td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  table.roster th { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-3); font-weight: 600; background: var(--surface); }
  table.roster td { color: var(--text-2); vertical-align: middle; }
  table.roster td.name { color: var(--text); font-weight: 500; }
  .num { font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <span class="brand">
      <span>
        <span class="brand-name">Claude Enterprise Training</span><br>
        <span class="brand-sub">Programme roster</span>
      </span>
    </span>
    <div class="topbar-spacer"></div>
    <div class="topbar-meta" id="meta"></div>
  </div>
</header>

<main class="wrap" style="padding-top:var(--xl);padding-bottom:var(--4xl)">

  <section id="gate" style="padding-top:var(--lg)">
    <div class="eyebrow">Restricted</div>
    <h1>Programme roster</h1>
    <p class="lede">Enrolments, module progress, and exam results per client organisation.</p>
    <div class="card" style="max-width:460px;margin-top:var(--lg)">
      <div class="field">
        <label for="pass">Passcode</label>
        <input id="pass" type="password" autocomplete="current-password">
      </div>
      <div id="gateErr" class="notice notice-err hidden" style="margin-top:var(--md)"></div>
      <div style="margin-top:var(--md)"><button class="btn btn-primary" id="go">Open roster</button></div>
    </div>
  </section>

  <section id="panel" class="hidden" style="padding-top:var(--lg)">
    <div class="row-between" style="margin-bottom:var(--lg);flex-wrap:wrap;gap:var(--md)">
      <div>
        <div class="eyebrow" style="margin-bottom:2px">Organisation</div>
        <h1 style="margin:0" id="company">—</h1>
      </div>
      <div class="row" style="gap:var(--sm)">
        <div class="field"><select id="orgSel"></select></div>
        <button class="btn" id="csvBtn">Export CSV</button>
      </div>
    </div>

    <div class="grid grid-3" style="margin-bottom:var(--lg)">
      <div class="card"><div class="dim" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">Enrolled</div><div style="font-size:30px;font-weight:700" class="num" id="kEnrolled">0</div></div>
      <div class="card"><div class="dim" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">Sat the exam</div><div style="font-size:30px;font-weight:700" class="num" id="kSat">0</div></div>
      <div class="card"><div class="dim" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">Certified</div><div style="font-size:30px;font-weight:700" class="num" id="kPassed">0</div></div>
    </div>

    <div class="scroll">
      <table class="roster">
        <thead><tr>
          <th>Name</th><th>Email</th><th>Modules</th><th>Exam</th><th>Status</th><th>Last active</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="dim" id="empty" style="margin-top:var(--md)"></p>
  </section>

</main>

<script src="app.js?v=8a3e698"></script>
<script>
(function () {
  var T = window.Train, passcode = '', current = null;

  function post(org) {
    return fetch('api/admin.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ passcode: passcode, org: org || '' })
    }).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j }; });
    });
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return isNaN(d.getTime()) ? '—' : d.toLocaleString();
  }

  function render(data) {
    current = data;
    document.getElementById('company').textContent = data.company || 'Select an organisation';

    var sel = document.getElementById('orgSel');
    if (!sel.options.length) {
      data.orgs.forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o.slug;
        opt.textContent = o.company + ' (' + o.slug + ')';
        sel.appendChild(opt);
      });
    }
    if (data.org) sel.value = data.org;

    var rows = data.trainees || [];
    document.getElementById('kEnrolled').textContent = rows.length;
    document.getElementById('kSat').textContent = rows.filter(function (r) { return r.score !== null; }).length;
    document.getElementById('kPassed').textContent = rows.filter(function (r) { return r.passed; }).length;

    var tb = document.getElementById('rows');
    tb.innerHTML = '';
    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      function cell(text, cls) {
        var td = T.el('td', cls || '', text);
        tr.appendChild(td);
        return td;
      }
      cell(r.name, 'name');
      cell(r.email);
      cell(String(r.modules), 'num');
      cell(r.score === null ? '—' : r.score + ' / ' + r.total, 'num');

      var status = T.el('td');
      var tag = T.el('span', r.passed ? 'tag tag-done' : 'tag tag-plain',
        r.passed ? 'Certified' : (r.score === null ? 'In progress' : 'Not passed'));
      status.appendChild(tag);
      tr.appendChild(status);

      cell(fmtDate(r.last));
      tb.appendChild(tr);
    });

    document.getElementById('empty').textContent =
      rows.length ? '' : 'No enrolments recorded for this organisation yet.';
  }

  function open(org) {
    return post(org).then(function (res) {
      if (res.status !== 200 || !res.body.ok) {
        var e = document.getElementById('gateErr');
        e.textContent = res.body && res.body.error ? res.body.error : 'Could not open the roster.';
        e.classList.remove('hidden');
        return;
      }
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('panel').classList.remove('hidden');
      render(res.body);

      if (!res.body.org && res.body.orgs.length) {
        open(res.body.orgs[0].slug);
      }
    }).catch(function () {
      var e = document.getElementById('gateErr');
      e.textContent = 'The roster service is unreachable.';
      e.classList.remove('hidden');
    });
  }

  document.getElementById('go').addEventListener('click', function () {
    passcode = document.getElementById('pass').value;
    if (!passcode) return;
    open('');
  });
  document.getElementById('pass').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('go').click();
  });
  document.getElementById('orgSel').addEventListener('change', function () {
    open(this.value);
  });

  document.getElementById('csvBtn').addEventListener('click', function () {
    if (!current || !current.trainees) return;
    var head = ['name', 'email', 'modules', 'score', 'total', 'passed', 'certId', 'first', 'last'];
    var esc = function (v) { return '"' + String(v === null ? '' : v).replace(/"/g, '""') + '"'; };
    var csv = [head.join(',')].concat(current.trainees.map(function (r) {
      return head.map(function (k) { return esc(r[k]); }).join(',');
    })).join('\n');

    var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = (current.org || 'roster') + '-training.csv';
    a.click();
    URL.revokeObjectURL(url);
  });
})();
</script>
</body>
</html>
